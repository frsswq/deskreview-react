name: Optimize uploaded images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "image-optimization"
  cancel-in-progress: false

jobs:
  optimize-images:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip image-optimize]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for uploaded source images
        id: image-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD^ > /dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -E '^public/img/(blog|home)/.*\.(png|jpg|jpeg)$'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Optimize uploaded images
        if: steps.image-changes.outputs.changed == 'true'
        run: bun run optimize:images

      - name: Commit optimized images
        if: steps.image-changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/img src/contents src/data/home/portfolio
          if ! git diff --cached --quiet; then
            git commit -m "chore(images): optimize uploaded images [skip image-optimize]"
            git push
          fi
